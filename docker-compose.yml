services:
  postgres:
    image: postgres:16-alpine
    container_name: golang-api-postgres
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER:-testuser}
      POSTGRES_PASSWORD: ${PGPASSWORD:-123456}
      POSTGRES_DB: ${PGDATABASE:-postgres}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-testuser} -d ${PGDATABASE:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  golang-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golang-api-app
    restart: always
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8080}
      PGHOST: postgres
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-testuser}
      PGPASSWORD: ${PGPASSWORD:-123456}
      PGDATABASE: ${PGDATABASE:-postgres}
      PGSSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

volumes:
  postgres_data: